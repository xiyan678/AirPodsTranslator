workflows:
  ios-simulator:
    name: iOS Simulator compile check
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: 26.6
    scripts:
      - name: Install XcodeGen
        script: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
      - name: Generate Xcode project
        script: |
          xcodegen generate
      - name: Build unsigned iOS Simulator app
        script: |
          xcodebuild -project AirPodsTranslator.xcodeproj \
            -scheme AirPodsTranslator \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build
          ditto -c -k --sequesterRsrc --keepParent \
            build/Build/Products/Release-iphonesimulator/AirPodsTranslator.app \
            build/AirPodsTranslator-simulator.zip
    artifacts:
      - build/AirPodsTranslator-simulator.zip
  ios-device-test:
    name: iPhone Ad Hoc test IPA
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: 26.6
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: app.eggplant1907.jet4469
    scripts:
      - name: Install XcodeGen
        script: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
      - name: Generate iPhone test project
        script: |
          xcodegen generate --spec project-device-test.yml
      - name: Set up Ad Hoc signing
        script: |
          xcode-project use-profiles --project AirPodsTranslatorDeviceTest.xcodeproj
      - name: Build signed IPA
        script: |
          xcode-project build-ipa \
            --project AirPodsTranslatorDeviceTest.xcodeproj \
            --scheme AirPodsTranslator
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
