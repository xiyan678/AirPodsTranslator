workflows:
  ios-simulator:
    name: iOS Simulator compile check
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: 26.6
    scripts:
      - name: Install XcodeGen
        script: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
      - name: Generate Xcode project
        script: |
          xcodegen generate
      - name: Build unsigned iOS Simulator app
        script: |
          xcodebuild -project AirPodsTranslator.xcodeproj \
            -scheme AirPodsTranslator \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build
          ditto -c -k --sequesterRsrc --keepParent \
            build/Build/Products/Release-iphonesimulator/AirPodsTranslator.app \
            build/AirPodsTranslator-simulator.zip
    artifacts:
      - build/AirPodsTranslator-simulator.zip
