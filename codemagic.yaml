workflows:
  ios-simulator:
    name: iOS Simulator compile check
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: 26.6
    scripts:
      - name: Install XcodeGen
        script: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
      - name: Generate Xcode project
        script: |
          xcodegen generate
          if [ -n "${SUMMARY_SERVICE_URL:-}" ]; then
            /usr/libexec/PlistBuddy -c "Set :EarYiSummaryServiceURL $SUMMARY_SERVICE_URL" iOS/Info.plist
          fi
      - name: Build unsigned iOS Simulator app
        script: |
          xcodebuild -project AirPodsTranslator.xcodeproj \
            -scheme AirPodsTranslator \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build
          ditto -c -k --sequesterRsrc --keepParent \
            build/Build/Products/Release-iphonesimulator/AirPodsTranslator.app \
            build/AirPodsTranslator-simulator.zip
    artifacts:
      - build/AirPodsTranslator-simulator.zip
  ios-device-test:
    name: iPhone Ad Hoc test IPA
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: 26.6
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: app.eggplant1907.jet4469
    scripts:
      - name: Install XcodeGen
        script: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
      - name: Generate iPhone test project
        script: |
          xcodegen generate --spec project-device-test.yml
          if [ -n "${SUMMARY_SERVICE_URL:-}" ]; then
            /usr/libexec/PlistBuddy -c "Set :EarYiSummaryServiceURL $SUMMARY_SERVICE_URL" iOS/Info.plist
          fi
      - name: Set up Ad Hoc signing
        script: |
          xcode-project use-profiles --project AirPodsTranslatorDeviceTest.xcodeproj
      - name: Build signed IPA
        script: |
          xcode-project build-ipa \
            --project AirPodsTranslatorDeviceTest.xcodeproj \
            --scheme AirPodsTranslator
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

  ios-regression:
    name: iOS automated regression tests
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: 26.6
    scripts:
      - name: Generate regression test project
        script: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen generate --spec project-regression.yml
      - name: Run XCTest on an available iPhone simulator
        script: |
          set -euo pipefail
          DEVICE_ID=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for group in d["devices"].values() for x in group if x["name"].startswith("iPhone")))')
          xcodebuild -project AirPodsTranslatorRegression.xcodeproj \
            -scheme AirPodsTranslatorRegression \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -resultBundlePath build/Regression.xcresult \
            CODE_SIGNING_ALLOWED=NO test
    artifacts:
      - build/Regression.xcresult
