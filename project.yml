name: AirPodsTranslator
options:
  bundleIdPrefix: com.example  # 替换为你的 Bundle ID 前缀，例如 com.yourcompany
  postGenCommand: sed -i '' -e 's|dstPath = "$(CONTENTS_FOLDER_PATH)/Watch";|dstPath = "";|' -e 's|dstSubfolderSpec = 16;|dstSubfolderSpec = 13;|' AirPodsTranslator.xcodeproj/project.pbxproj
  deploymentTarget:
    iOS: '26.0'
    watchOS: '11.0'
packages:
  SherpaOnnx:
    path: ThirdParty/SherpaOnnx
  ArgmaxOSS:
    url: https://github.com/argmaxinc/argmax-oss-swift.git
    exactVersion: 1.1.0
targets:
  AirPodsTranslator:
    type: application
    platform: iOS
    sources: [iOS, Shared]
    dependencies:
      - package: SherpaOnnx
        product: SherpaOnnx
      - package: ArgmaxOSS
        product: WhisperKit
      - target: TranslatorWatch
        embed: true
      - target: BroadcastUpload
        embed: true
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: 声译
        EarYiSummaryServiceURL: "https://ai.duwang.win/v1/summary"
        NSMicrophoneUsageDescription: 用于识别面对面交谈的语音并翻译。
        NSCameraUsageDescription: 用于拍照识别文字并翻译。
        NSPhotoLibraryUsageDescription: 用于选择照片识别其中的文字。
        LSApplicationQueriesSchemes: [snssdk1128]
        UIBackgroundModes: [audio]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.AirPodsTranslator
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: iOS/AirPodsTranslator.entitlements
        SUPPORTS_MACCATALYST: NO
  BroadcastUpload:
    type: app-extension
    platform: iOS
    sources: [BroadcastUpload, Shared]
    info:
      path: BroadcastUpload/Info.plist
      properties:
        CFBundleDisplayName: 声译屏幕音频
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SampleHandler
          NSExtensionAttributes:
            RPBroadcastProcessMode: RPBroadcastProcessModeSampleBuffer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.AirPodsTranslator.broadcast
        CODE_SIGN_ENTITLEMENTS: BroadcastUpload/BroadcastUpload.entitlements
  TranslatorWatch:
    type: application
    platform: watchOS
    sources: [Watch]
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: 声译
        WKCompanionAppBundleIdentifier: com.example.AirPodsTranslator
        WKWatchKitApp: true
        WKWatchOnly: false
        WKRunsIndependentlyOfCompanionApp: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.AirPodsTranslator.watchkitapp
