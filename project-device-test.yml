name: AirPodsTranslatorDeviceTest
options:
  preGenCommand: python3 scripts/prepare_sherpa.py
  bundleIdPrefix: app.eggplant1907
  deploymentTarget:
    iOS: '26.0'
packages:
  SherpaOnnx:
    path: ThirdParty/SherpaOnnx
  ArgmaxOSS:
    url: https://github.com/argmaxinc/argmax-oss-swift.git
    exactVersion: 1.1.0
targets:
  AirPodsTranslator:
    type: application
    platform: iOS
    sources: [iOS, Shared]
    dependencies:
      - package: SherpaOnnx
        product: SherpaOnnx
      - package: ArgmaxOSS
        product: WhisperKit
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: 声译
        EarYiSummaryServiceURL: "https://ai.duwang.win/v1/summary"
        NSMicrophoneUsageDescription: 用于识别面对面交谈的语音并翻译。
        NSCameraUsageDescription: 用于拍照识别文字并翻译。
        NSPhotoLibraryUsageDescription: 用于选择照片识别其中的文字。
        LSApplicationQueriesSchemes: [snssdk1128]
        UIBackgroundModes: [audio]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.eggplant1907.jet4469
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) EAR_YI_DEVICE_TEST"
        SUPPORTS_MACCATALYST: NO
